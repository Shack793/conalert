name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DEPLOY_PATH: /home/conapafe/public_html

jobs:
  deploy:
    name: Deploy production files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$CPANEL_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$CPANEL_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Upload and activate release
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_PORT: ${{ vars.CPANEL_SSH_PORT || '21098' }}
          DEPLOY_PATH: ${{ vars.CPANEL_DEPLOY_PATH || '/home/conapafe/public_html' }}
        run: |
          set -euo pipefail

          ssh_cmd=(ssh -p "$CPANEL_SSH_PORT" -i "$HOME/.ssh/deploy_key" -o BatchMode=yes)
          target="${CPANEL_USER}@${CPANEL_HOST}"
          release="conalert-release-${GITHUB_SHA}"
          backup="conalert-backup-$(date -u +%Y%m%d-%H%M%S)"
          remote_release="/home/${CPANEL_USER}/${release}"
          archive="$RUNNER_TEMP/conalert-release.tar.gz"

          # Export the committed revision directly. This cannot include the
          # archive itself or observe files changing in the runner workspace.
          git archive --format=tar.gz --output="$archive" HEAD

          "${ssh_cmd[@]}" "$target" "mkdir -p \"$remote_release\" \"/home/${CPANEL_USER}/deploy-backups\""
              scp -P "$CPANEL_SSH_PORT" -i "$HOME/.ssh/deploy_key" -o BatchMode=yes "$archive" "$target:$remote_release/"

          "${ssh_cmd[@]}" "$target" bash -s -- "$release" "$backup" "$DEPLOY_PATH" <<'REMOTE'
          set -euo pipefail
          release="$1"
          backup="$2"
          app="$3"

          mkdir -p "$HOME/deploy-backups/$backup"
          cp -a "$app"/. "$HOME/deploy-backups/$backup"/
          tar -xzf "$HOME/$release/release.tar.gz" -C "$HOME/$release"

          # Preserve production configuration and runtime uploads. Do not run
          # database migrations as part of a code deployment.
          rsync -a --delete \
            --exclude='config.php' \
            --exclude='uploads/' \
            --exclude='admin.zip' \
            --exclude='api/error_log' \
            --exclude='db/*.sql' \
            --exclude='index.html' \
            --exclude='cases.html' \
            --exclude='resources.html' \
            --exclude='submit.html' \
            --exclude='parking-page.shtml' \
            "$HOME/$release/" "$app/"

          chmod 600 "$app/config.php"
          rm -rf "$HOME/$release"
          find "$HOME/deploy-backups" -mindepth 1 -maxdepth 1 -type d -mtime +14 -exec rm -rf {} +
          REMOTE

      - name: Remove temporary SSH files
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts" "$RUNNER_TEMP/conalert-release.tar.gz"